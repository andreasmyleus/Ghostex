name: GPUI release - WSL gxserver

# CDXC:ReleaseChangeAwarePlanning 2026-08-13:
# The gxserver tarball is awaited just in time rather than through a `needs:`
# edge, so this ~1 minute repackaging job no longer forces the parent graph to
# serialize around the gxserver builds.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      arch:
        required: true
        type: string
      source_run_id:
        required: false
        default: ''
        type: string
      plan:
        description: Resolved release plan JSON from the prepare job
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      arch:
        description: WSL runtime architecture
        required: true
        default: x64
        type: choice
        options: [x64, arm64]
      source_run_id:
        description: Workflow run containing release-gxserver-linux-<arch>
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GHOSTEX_RELEASE_PLAN: ${{ inputs.plan }}
      GHOSTEX_RELEASE_SOURCE_SHA: ${{ github.sha }}
      GHOSTEX_RELEASE_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - name: Await the gxserver runtime artifact of this run
        if: ${{ inputs.source_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          node tooling/release-gpui/await-run-artifacts.mjs \
            --names release-gxserver-linux-${INPUT_ARCH} \
            --producer-pattern "^(gxserver_${INPUT_ARCH}|reuse)" \
            --timeout-minutes 45
      - uses: actions/download-artifact@v8
        if: ${{ inputs.source_run_id == '' }}
        with:
          name: release-gxserver-linux-${{ inputs.arch }}
          path: build/runtime-artifacts/${{ inputs.arch }}
      - uses: actions/download-artifact@v8
        if: ${{ inputs.source_run_id != '' }}
        with:
          name: release-gxserver-linux-${{ inputs.arch }}
          path: build/runtime-artifacts/${{ inputs.arch }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Package truthful WSL bootstrap
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: >-
          tooling/release-gpui/wsl-runtime.sh
          "${INPUT_VERSION}"
          "${INPUT_ARCH}"
          "build/runtime-artifacts/${INPUT_ARCH}/gxserver-linux-${INPUT_ARCH}.tar.gz"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-gpui/${{ inputs.version }}/gxserver-wsl-windows-${{ inputs.arch }}/gxserver-wsl-windows-${{ inputs.arch }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-gxserver-wsl-windows-${{ inputs.arch }}
          path: build/release-gpui/${{ inputs.version }}/gxserver-wsl-windows-${{ inputs.arch }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.plan != '' }}
        with:
          name: release-provenance-gxserver-wsl-windows-${{ inputs.arch }}
          path: build/release-gpui/${{ inputs.version }}/gxserver-wsl-windows-${{ inputs.arch }}/provenance.json
          if-no-files-found: error
          retention-days: 14
