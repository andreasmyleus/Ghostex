name: GPUI release - Windows

# CDXC:ReleaseChangeAwarePlanning 2026-08-13, amended 2026-09-01 and 2026-09-02:
# No `needs: gxserver_*` edge, and (since 2026-09-01) no `needs: validate_windows`
# edge either. This job starts as soon as `prepare` is done. The gxserver tarball
# and the code-server component archive are awaited just in time: since
# 2026-09-02 that is immediately before the packaging phase of windows.ps1,
# AFTER the Rust compile, because the compile does not read either archive.
# Measured on 8.5.0 (run 33462783752) the await step idled for 226 s in front
# of a cold `cargo build`; now the ~7 minutes of runner setup AND the whole
# compile overlap the gxserver jobs instead of queueing behind them. Release
# 7.7's one-line Windows-only compile error surfaced an hour after dispatch
# purely because of the old `needs:` edges.
#
# The code-server component identity is resolved locally from the pinned
# submodule instead of being threaded through workflow outputs: the identity is
# a pure function of the checkout, and codeServerComponentNames() stays the
# single source of the artifact name (risk R9).
#
# CDXC:Release 2026-09-16 WHY:
# The native Windows editor is no longer compiled inside the packaging phase
# (28 min on x64, 50 min on ARM64 in 9.6.0). release-gpui-code-server-windows.yml
# builds or reuses it as the immutable windows-native-<arch> asset of the
# code-server component tag; this job awaits that artifact just in time, right
# before the packaging phase, downloads it, and hands it to
# build-windows-code-server.ps1 as GHOSTEX_WINDOWS_NATIVE_CODE_SERVER_ARCHIVE,
# which verifies and unpacks it instead of building. The editor build tools are
# only prepared for a standalone dispatch, where the script falls through to the
# source build when nothing is published yet.
#
# Zig dependency prefetching is deliberately Linux/macOS only: ZIG_GLOBAL_CACHE_DIR
# must be a native Windows path, which the bash prefetch helper cannot produce.
# Windows gets the same protection from the restored Zig package cache.
#
# CDXC:WindowsSccache 2026-09-02:
# The Cargo caches below only ever held ~/.cargo/registry and ~/.cargo/git, so
# every release recompiled every third-party crate from scratch (8.5.0
# windows_x64: 1175 s inside windows.ps1, almost all of it rustc). sccache with
# the GitHub Actions cache backend caches compiled artifacts across runs. It is
# purely additive: RUSTC_WRAPPER only interposes sccache in front of the same
# rustc with the same flags, so the produced binaries are unchanged.
# SCCACHE_GHA_VERSION namespaces the cache per architecture; bump the trailing
# number to invalidate it deliberately. CARGO_INCREMENTAL=0 is what sccache
# requires (incremental artifacts are not cacheable) and is already the
# default for the release profile the build uses.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      arch:
        required: true
        type: string
      sign:
        required: false
        default: false
        type: boolean
      runtime_artifacts_ready:
        required: false
        default: false
        type: boolean
      plan:
        description: Resolved release plan JSON from the prepare job
        required: false
        default: ''
        type: string
    secrets:
      WINDOWS_CODE_SIGN_PFX_BASE64:
        required: false
      WINDOWS_CODE_SIGN_PFX_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      arch:
        description: Windows architecture
        required: true
        default: x64
        type: choice
        options: [x64, arm64]

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2025' }}
    # CDXC:WindowsWedgedRunnerWatchdog 2026-09-01 (supersedes
    # CDXC:WindowsArm64BuildBudget 2026-08-19):
    # This job has now wedged twice, both times on windows-11-vs2026-arm, both
    # times mid-`cargo build` with the process alive and completely silent:
    # 7.11.0 sat inside the ghostex-gpui crate for 103 minutes (retry: 13m33s),
    # and 8.4.0 emitted its last line at 05:42:59 and nothing at all for the
    # next 101 minutes until this budget killed it (retry of byte-identical
    # source, with a cold CEF *and* cold Zig cache: 23m59s). A wedged runner is
    # not a slow build, so the budget is not the mechanism that should catch it
    # — the stdout-silence watchdog on the build steps below is. This budget is
    # only the backstop for a wedge the watchdog itself cannot see (a hung
    # runner agent, a hung `taskkill`).
    #
    # 90, not 120, and not 60. The watchdog can legitimately consume one full
    # silence window plus a second full build inside this one job:
    #   ~7m setup + up to ~24m of attempt 1 + 15m silence detection
    #   + ~24m of attempt 2 + ~5m packaging/upload  =  ~75m worst case.
    # 60 would kill a legitimately-recovering job; 120 buys nothing the
    # watchdog does not already cover, it only burns runner minutes.
    # Since 2026-09-02 the build runs as two watched phases (compile, then
    # package); each phase gets its own restart-once-on-wedge, and the same
    # arithmetic still fits because a wedge in both phases of one job has
    # never been observed and the compile phase is now sccache-warm.
    #
    # CDXC:Release 2026-09-15 WHY:
    # 9.6.0's Windows ARM64 job was killed by the 90-minute budget while still
    # making steady progress: 21 min compile, then the native editor build
    # inside the packaging phase ran past minute 90. x64 finishes in about 60
    # minutes; ARM64 needs more. That is a slow job, not a wedge, and the
    # silence watchdog still catches wedges, so the budget only has to cover
    # real work.
    timeout-minutes: ${{ inputs.arch == 'arm64' && 150 || 100 }}
    env:
      GHOSTEX_RELEASE_SOURCE_SHA: ${{ github.sha }}
      GHOSTEX_RELEASE_WORKFLOW_SHA: ${{ github.sha }}
      OUTPUT_DIR: build/release-gpui/${{ inputs.version }}/windows-${{ inputs.arch }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: windows-${{ inputs.arch }}-1
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # Component tags are published to a separate repository that
      # github.token cannot write; fail before any build work when the PAT is
      # missing (see tooling/release-gpui/components-repo-setup.md).
      - name: Require the components publishing token
        shell: bash
        env:
          COMPONENTS_GITHUB_TOKEN: ${{ secrets.COMPONENTS_GITHUB_TOKEN }}
        run: |
          if [[ -z "$COMPONENTS_GITHUB_TOKEN" ]]; then
            echo "::error::COMPONENTS_GITHUB_TOKEN is not configured; component tags are published to $(node tooling/release-gpui/components-repo.mjs) and github.token cannot write there. See tooling/release-gpui/components-repo-setup.md."
            exit 1
          fi
      - name: Restore code-server source identity input
        run: git submodule update --init --depth=1 -- .dependencies/code-server
      - name: Set up the pinned native editor Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .dependencies/code-server/.node-version
          architecture: ${{ inputs.arch }}
      # A release run consumes the native editor component built by
      # code_server_windows_<arch>; only a standalone dispatch may need to build
      # the editor from source here, so only it prepares the editor toolchain.
      - name: Prepare native editor build tools for a standalone dispatch
        if: ${{ ! inputs.runtime_artifacts_ready }}
        shell: pwsh
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: tooling/release-gpui/prepare-windows-editor-tools.ps1 -Arch "$env:INPUT_ARCH"
      - name: Resolve immutable code-server component identity
        id: code_server_identity
        shell: bash
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: node tooling/release-gpui/code-server-component-identity.mjs --root .dependencies/code-server --platform "linux-${INPUT_ARCH}" --github-output >> "$GITHUB_OUTPUT"
      - name: Resolve the native editor component artifact name
        id: code_server_native
        shell: bash
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: node tooling/release-gpui/code-server-component-identity.mjs --root .dependencies/code-server --platform "windows-native-${INPUT_ARCH}" --github-output >> "$GITHUB_OUTPUT"
      - name: Resolve dependency cache keys
        id: cache_keys
        shell: bash
        run: |
          {
            printf 'cef=%s\n' "$(git rev-parse HEAD:.dependencies/cef-rs)"
            printf 'zig=%s\n' "$(git rev-parse HEAD:.dependencies/ghostty)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-reg-windows-${{ inputs.arch }}-${{ hashFiles('apps/desktop/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: cargo-reg-windows-${{ inputs.arch }}-
      # CDXC:WindowsSccache 2026-09-02: installs sccache, puts it on PATH for
      # every later step (and therefore for the watched child pwsh processes,
      # which inherit this step environment), and exports the Actions cache
      # endpoint/token that the GHA backend needs into GITHUB_ENV.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Restore CEF distribution cache
        uses: actions/cache@v6
        id: cef_cache
        with:
          path: apps/desktop/build/cef-cache
          key: cef-windows-${{ inputs.arch }}-${{ steps.cache_keys.outputs.cef }}
      - name: Restore Zig package cache
        uses: actions/cache@v6
        id: zig_cache
        with:
          path: build/zig-global-cache
          key: zig-windows-${{ inputs.arch }}-${{ steps.cache_keys.outputs.zig }}
          restore-keys: zig-windows-${{ inputs.arch }}-
      - name: Install pinned Zig
        shell: pwsh
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: tooling/release-gpui/prepare-zig.ps1 -Arch "$env:INPUT_ARCH"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Velopack CLI
        shell: bash
        run: tooling/release-gpui/retry.sh 3 5 -- dotnet tool install --global vpk --version 1.2.0
      - name: Install JavaScript dependencies
        shell: bash
        run: tooling/release-gpui/retry.sh 3 5 -- bun install --frozen-lockfile
      - name: Restore Windows code-signing certificate
        if: ${{ inputs.sign }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\ghostex-code-signing.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
      # CDXC:WindowsWedgedRunnerWatchdog 2026-09-01, split into phases 2026-09-02:
      # windows.ps1 is the only long work in this job (cargo build + zig +
      # vite + vpk pack + signtool), and it is where both documented
      # windows_arm64 wedges died. It runs as a watched child process instead
      # of directly, so the job can tell "wedged" apart from "slow" and recover
      # without a human redispatching the release.
      #
      # The signal is ABSENCE OF OUTPUT, never elapsed time. A healthy build
      # is chatty end to end: cargo prints a line per crate, zig per step, vpk
      # per package. The wedges were the opposite — an alive, silent process.
      # Elapsed-time budgets cannot separate the two; silence can.
      #
      # Why 15 minutes: the whole healthy build is ~18 minutes inside a ~24
      # minute cold-cache job (8.4.0 windows_arm64 retry: 23m59s with a cold
      # CEF distribution cache and a cold Zig package cache). A 15 minute
      # silent stretch therefore cannot fit inside a healthy run — the longest
      # single silent unit is one crate's rustc invocation — while the two
      # observed wedges were silent for 101 and 103 minutes. It is ~5x the
      # longest plausible healthy gap and ~1/7 of an observed wedge, so there
      # is no ambiguity in either direction. Tune it with
      # GHOSTEX_WINDOWS_BUILD_SILENCE_SECONDS if the build's shape changes.
      #
      # A watchdog kill is the ONLY thing that retries. A non-zero exit code —
      # a real compile error, a signing failure, a missing artifact — is
      # surfaced and fails the step on the first attempt, with the child's
      # full stdout and stderr already streamed into this log. The second
      # wedge in a row fails the job for real; we never loop.
      #
      # The build is two watched phases of the same script, plus the native
      # runtime half that the `runtime` job below compiles on its own runner.
      # Every phase runs under tooling/release-gpui/windows-build-watchdog.ps1
      # (written inline to RUNNER_TEMP here until 2026-10-07, when a second job
      # needed it). Steps share no shell state; each phase gets its own attempt
      # counter, its own log files, and the identical restart-once-on-wedge
      # semantics. Everything a later phase needs from an earlier one is on
      # disk (apps/desktop/target, apps/desktop/dist, .dependencies references,
      # the downloaded native runtime outputs), never in process env.
      # Phase 1 of windows.ps1: GPUI reference checkout, sidebar bundle (vite),
      # and `cargo build --release` of the four desktop binaries. Reads no
      # runtime artifact, so it runs while the gxserver job is still building.
      # The native runtime (gxserver, wmx, prompt editor) is the `runtime`
      # job's half of the compile and arrives as an artifact before packaging.
      - name: Compile the desktop app (sidebar bundle + cargo build)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_WINDOWS_SIGNING_PFX: ${{ runner.temp }}\ghostex-code-signing.pfx
          GHOSTEX_WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PFX_PASSWORD }}
          GHOSTEX_WINDOWS_REQUIRE_SIGNING: ${{ inputs.sign && '1' || '0' }}
          GHOSTEX_WINDOWS_REQUIRE_WSL_RUNTIME: ${{ inputs.runtime_artifacts_ready && '1' || '0' }}
          GHOSTEX_WINDOWS_WSL_GXSERVER_ARCHIVE: ${{ github.workspace }}\build\runtime-artifacts\${{ inputs.arch }}\gxserver-linux-${{ inputs.arch }}.tar.gz
          GHOSTEX_CODE_SERVER_COMPONENT_VERSION: ${{ steps.code_server_identity.outputs.component_version }}
          GHOSTEX_WINDOWS_WSL_CODE_SERVER_ARCHIVE: ${{ github.workspace }}\build\runtime-artifacts\${{ inputs.arch }}\${{ steps.code_server_identity.outputs.archive_name }}
          GHOSTEX_WINDOWS_NATIVE_CODE_SERVER_ARCHIVE: ${{ inputs.runtime_artifacts_ready && format('{0}\build\runtime-artifacts\native-editor-{1}\{2}', github.workspace, inputs.arch, steps.code_server_native.outputs.archive_name) || '' }}
          GHOSTEX_WINDOWS_BUILD_SILENCE_SECONDS: '900'
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tooling/release-gpui/windows-build-watchdog.ps1') -Phase compile-app -Version "$env:INPUT_VERSION" -Arch "$env:INPUT_ARCH"
      # The runtime artifacts are only read by the packaging phase (WSL
      # gxserver staging + code-server component resealing), so they are
      # awaited here, after the compile, not before it.
      - name: Await the runtime artifacts of this run
        if: ${{ inputs.runtime_artifacts_ready }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          node tooling/release-gpui/await-run-artifacts.mjs \
            --names "release-gxserver-linux-${INPUT_ARCH},${{ steps.code_server_identity.outputs.artifact_name }}" \
            --producer-pattern "^(gxserver_${INPUT_ARCH}|code_server_${INPUT_ARCH}|reuse)" \
            --timeout-minutes 45
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: release-gxserver-linux-${{ inputs.arch }}
          path: build/runtime-artifacts/${{ inputs.arch }}
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: ${{ steps.code_server_identity.outputs.artifact_name }}
          path: build/runtime-artifacts/${{ inputs.arch }}
      - name: Reuse the published Source component for standalone runs
        if: ${{ ! inputs.runtime_artifacts_ready }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          tooling/release-gpui/retry.sh 4 2 -- node tooling/release-gpui/publish-component.mjs \
            --reuse-published \
            --metadata-only \
            --require-sha256-sidecars \
            --component code-server \
            --version '${{ steps.code_server_identity.outputs.component_version }}' \
            --platform "linux-${INPUT_ARCH}" \
            --asset-dir "build/runtime-artifacts/${INPUT_ARCH}" \
            --output build/runtime-artifacts/code-server-components.json
      - name: Validate the Source component archive
        shell: bash
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          node tooling/release-gpui/verify-code-server-archive.mjs \
            --archive "build/runtime-artifacts/${INPUT_ARCH}/${{ steps.code_server_identity.outputs.archive_name }}" \
            --version '${{ steps.code_server_identity.outputs.component_version }}' \
            --platform "linux-${INPUT_ARCH}"
      # The native editor component is published by its own job and is only
      # read by the packaging phase, so it is awaited here, after the compile.
      # A cold editor build takes about 28 minutes on x64 and 50 on ARM64 after
      # its own runner setup, and both jobs start together, so the window is
      # longer than the runtime artifacts above and longer still on ARM64; it
      # still fits the job budget with the compile and packaging phases.
      - name: Await the native editor component of this run
        if: ${{ inputs.runtime_artifacts_ready }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_ARCH_TIMEOUT_MINUTES: ${{ inputs.arch == 'arm64' && 90 || 60 }}
        run: |
          node tooling/release-gpui/await-run-artifacts.mjs \
            --names "${{ steps.code_server_native.outputs.artifact_name }}" \
            --producer-pattern "^(code_server_windows_${INPUT_ARCH})" \
            --timeout-minutes ${INPUT_ARCH_TIMEOUT_MINUTES}
      - uses: actions/download-artifact@v8
        if: ${{ inputs.runtime_artifacts_ready }}
        with:
          name: ${{ steps.code_server_native.outputs.artifact_name }}
          path: build/runtime-artifacts/native-editor-${{ inputs.arch }}
      - name: Validate the native editor component archive
        if: ${{ inputs.runtime_artifacts_ready }}
        shell: bash
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          node tooling/release-gpui/verify-windows-native-code-server-archive.mjs \
            --archive "build/runtime-artifacts/native-editor-${INPUT_ARCH}/${{ steps.code_server_native.outputs.archive_name }}" \
            --version '${{ steps.code_server_identity.outputs.component_version }}' \
            --platform "windows-native-${INPUT_ARCH}"
      # The `runtime` job of this workflow compiles gxserver, ghostex, wmx and
      # the prompt editor on a second runner of the same label while this job
      # compiles the desktop app; it uploads them at their repo paths, so the
      # download below puts them exactly where the packaging phase copies them
      # from. It always finishes long before the desktop compile, so this wait
      # is normally a single poll.
      - name: Await the native runtime binaries of this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          node tooling/release-gpui/await-run-artifacts.mjs \
            --names "release-windows-native-runtime-${INPUT_ARCH}" \
            --producer-pattern "(^|/ )native runtime \(${INPUT_ARCH}\)$" \
            --timeout-minutes 60
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-native-runtime-${{ inputs.arch }}
          path: ${{ github.workspace }}
      - name: Verify the native runtime binaries
        shell: bash
        run: |
          for output in \
            server/target/release/gxserver.exe \
            server/target/release/ghostex.exe \
            .dependencies/wmx/target/release/wmx.exe \
            apps/editor/desktop/target/release/ghostex-editor.exe \
            apps/editor/dist/web/index.html; do
            [[ -s "$output" ]] || { echo "::error::The native runtime artifact is missing $output" >&2; exit 1; }
          done
          sha256sum server/target/release/gxserver.exe server/target/release/ghostex.exe \
            .dependencies/wmx/target/release/wmx.exe apps/editor/desktop/target/release/ghostex-editor.exe
      # Phase 2 of windows.ps1: stage the app directory from the compiled
      # binaries, seal the CEF / code-server components, verify the staged
      # tree, sign the binaries, vpk pack, bundle and sign the launcher, and
      # write manifest.json. Same env as phase 1.
      - name: Stage, package, and sign the installer and portable package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COMPONENTS_GITHUB_TOKEN: ${{ secrets.COMPONENTS_GITHUB_TOKEN }}
          GHOSTEX_WINDOWS_SIGNING_PFX: ${{ runner.temp }}\ghostex-code-signing.pfx
          GHOSTEX_WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PFX_PASSWORD }}
          GHOSTEX_WINDOWS_REQUIRE_SIGNING: ${{ inputs.sign && '1' || '0' }}
          GHOSTEX_WINDOWS_REQUIRE_WSL_RUNTIME: ${{ inputs.runtime_artifacts_ready && '1' || '0' }}
          GHOSTEX_WINDOWS_WSL_GXSERVER_ARCHIVE: ${{ github.workspace }}\build\runtime-artifacts\${{ inputs.arch }}\gxserver-linux-${{ inputs.arch }}.tar.gz
          GHOSTEX_CODE_SERVER_COMPONENT_VERSION: ${{ steps.code_server_identity.outputs.component_version }}
          GHOSTEX_WINDOWS_WSL_CODE_SERVER_ARCHIVE: ${{ github.workspace }}\build\runtime-artifacts\${{ inputs.arch }}\${{ steps.code_server_identity.outputs.archive_name }}
          GHOSTEX_WINDOWS_NATIVE_CODE_SERVER_ARCHIVE: ${{ inputs.runtime_artifacts_ready && format('{0}\build\runtime-artifacts\native-editor-{1}\{2}', github.workspace, inputs.arch, steps.code_server_native.outputs.archive_name) || '' }}
          GHOSTEX_WINDOWS_BUILD_SILENCE_SECONDS: '900'
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tooling/release-gpui/windows-build-watchdog.ps1') -Phase package -Version "$env:INPUT_VERSION" -Arch "$env:INPUT_ARCH"
      - name: Write release provenance
        if: ${{ inputs.plan != '' }}
        shell: bash
        env:
          GHOSTEX_RELEASE_PLAN: ${{ inputs.plan }}
        run: node tooling/release-gpui/write-provenance.mjs --dir "$OUTPUT_DIR"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.OUTPUT_DIR }}/*.exe
            ${{ env.OUTPUT_DIR }}/*.zip
            ${{ env.OUTPUT_DIR }}/*.nupkg
            ${{ env.OUTPUT_DIR }}/releases.*.json
            ${{ env.OUTPUT_DIR }}/assets.*.json
            ${{ env.OUTPUT_DIR }}/RELEASES-*
      - name: Record job observability
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "- Cargo registry cache: ${{ steps.cargo_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- CEF distribution cache: ${{ steps.cef_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- Zig package cache: ${{ steps.zig_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report sccache statistics
        if: ${{ always() }}
        shell: pwsh
        run: sccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ inputs.arch }}
          path: build/release-gpui/${{ inputs.version }}/windows-${{ inputs.arch }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.plan != '' }}
        with:
          name: release-provenance-windows-${{ inputs.arch }}
          path: build/release-gpui/${{ inputs.version }}/windows-${{ inputs.arch }}/provenance.json
          if-no-files-found: error
          retention-days: 14

  # CDXC:Release 2026-10-07 WHY:
  # The native Windows runtime (gxserver.exe, ghostex.exe, wmx.exe, the prompt
  # editor helper and its page) used to compile in jobs.build after the desktop
  # crate, inside the same compile step: 5m02s + 36s + 33s on ARM64 and
  # 5m38s + 56s + 29s on x64 in 10.14.0 (run 37558383921). Both builds are
  # CPU-bound (the desktop crate holds 90-100 % CPU for its whole compile), so
  # only a second runner can overlap them. This job runs windows.ps1's
  # compile-runtime half on the same runner label with the same job env, so
  # the binaries come from the same toolchain, flags and sccache namespace
  # (keep runs-on and env identical to jobs.build; the windows-runtime
  # assertions in tooling/release-workflow-assertions.mjs check both). Its
  # outputs ship unsigned, exactly as before: signing, staging, the native
  # runtime fingerprint and provenance all still happen in jobs.build's
  # package phase. Everything else about the release (plan,
  # reuse, publish) only ever sees jobs.build's release-windows-<arch>
  # artifact.
  runtime:
    name: native runtime (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2025' }}
    # Setup plus ~7 minutes of cargo; the budget leaves room for one watchdog
    # restart, the same arithmetic as jobs.build.
    timeout-minutes: 60
    env:
      GHOSTEX_RELEASE_SOURCE_SHA: ${{ github.sha }}
      GHOSTEX_RELEASE_WORKFLOW_SHA: ${{ github.sha }}
      OUTPUT_DIR: build/release-gpui/${{ inputs.version }}/windows-${{ inputs.arch }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: windows-${{ inputs.arch }}-1
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # Same Node.js as jobs.build, which pins it from the code-server checkout.
      - name: Restore code-server source identity input
        run: git submodule update --init --depth=1 -- .dependencies/code-server
      - name: Set up the pinned native editor Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .dependencies/code-server/.node-version
          architecture: ${{ inputs.arch }}
      # Its own key: jobs.build no longer downloads the server, wmx or editor
      # crates, so sharing its key would leave whichever job saves second cold.
      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-reg-windows-${{ inputs.arch }}-runtime-${{ hashFiles('server/Cargo.lock', 'apps/editor/desktop/Cargo.lock') }}
          restore-keys: cargo-reg-windows-${{ inputs.arch }}-runtime-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # tooling/prepare-windows-build.ps1 requires the pinned Zig for every
      # Windows build entry, even though this half compiles no Zig code.
      - name: Install pinned Zig
        shell: pwsh
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: tooling/release-gpui/prepare-zig.ps1 -Arch "$env:INPUT_ARCH"
      - name: Install JavaScript dependencies
        shell: bash
        run: tooling/release-gpui/retry.sh 3 5 -- bun install --frozen-lockfile
      - name: Compile the native runtime (gxserver, wmx, prompt editor)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_WINDOWS_BUILD_SILENCE_SECONDS: '900'
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tooling/release-gpui/windows-build-watchdog.ps1') -Phase compile-runtime -Version "$env:INPUT_VERSION" -Arch "$env:INPUT_ARCH"
      - name: Record the native runtime checksums
        shell: bash
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          {
            echo "### Native runtime (${INPUT_ARCH})"
            echo '```'
            sha256sum server/target/release/gxserver.exe server/target/release/ghostex.exe \
              .dependencies/wmx/target/release/wmx.exe apps/editor/desktop/target/release/ghostex-editor.exe
            echo '```'
            echo "- Cargo registry cache: ${{ steps.cargo_cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      # Uploaded from the workspace root so the archive keeps the repo-relative
      # paths jobs.build downloads into. .dependencies is a dot directory,
      # which upload-artifact skips unless hidden files are included.
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-native-runtime-${{ inputs.arch }}
          path: |
            server/target/release/gxserver.exe
            server/target/release/ghostex.exe
            .dependencies/wmx/target/release/wmx.exe
            apps/editor/desktop/target/release/ghostex-editor.exe
            apps/editor/dist/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Report sccache statistics
        if: ${{ always() }}
        shell: pwsh
        run: sccache --show-stats
