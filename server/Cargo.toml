[package]
name = "gxserver"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crossterm = "0.28"
futures-util = "0.3"
ghostex-paths = { path = "../packages/paths" }
ghostex-docs = { path = "../packages/project-docs" }
ghostex-find = { path = "../packages/find" }
ghostex-settings-catalog = { path = "../packages/settings-catalog" }
# CDXC:FilesAndLinks 2026-10-12 SEE-ALSO:
# The chat core's own rules for what a message mentions (`transcript/files_links.rs`), which
# `readSessionFilesLinks` runs over every transcript so the list and the transcript agree.
ghostex-gx-chat-core = { path = "../packages/gx-chat-core" }
# CDXC:SessionChat 2026-10-06 SEE-ALSO:
# `ghostex visual check` draws a chat ```visual block with the same layout crate the chat
# clients use, and paints it to a PNG with resvg (the renderer the desktop's diagrams use).
ghostex-gx-visual = { path = "../packages/gx-visual" }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# PNG encoding for the check's picture (tiny-skia's `png-format`, on by default).
tiny-skia = "0.11"
ghostex-agent-sync = { path = "../packages/agent-sync" }
# The live subscription to a Work workspace's team Convex project (crate::team_sync). rustls, not the
# default vendored OpenSSL, so it reuses the TLS stack the server already ships.
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-webpki-roots"] }
libc = "0.2"
markdown = "1"
md-5 = "0.10"
percent-encoding = "2"
portable-pty = "0.9"
rand = "0.8"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.22"
tower = "0.5"
url = "2"
vt100 = "0.16"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
jsonc-parser = { version = "0.33.2", features = ["cst", "serde"] }

[target.'cfg(windows)'.dependencies]
ghostex-editor-client = { path = "../packages/editor-client" }
windows-sys = { version = "0.59", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_ProcessSnapshotting",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }
